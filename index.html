<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Имитационное моделирование — интерактивный тест</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --amber: #d97706;
    --amber-bg: #fef3c7;
    --shadow: 0 10px 30px rgba(0,0,0,.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, var(--bg) 45%, #f0fdf4 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: clamp(1.25rem, 2.4vw, 1.8rem);
    margin: 0 0 6px;
    letter-spacing: -.02em;
  }
  header p { margin: 0; color: var(--muted); font-size: .95rem; }

  .progress-shell {
    height: 10px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin: 18px 0 8px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), #22c55e);
    transition: width .35s ease;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .88rem;
    color: var(--muted);
    margin-bottom: 14px;
    gap: 12px;
  }
  .badge {
    background: #e0e7ff;
    color: #3730a3;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: .8rem;
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(18px, 3vw, 30px);
    border: 1px solid rgba(255,255,255,.7);
  }

  .q-title {
    font-size: clamp(1.02rem, 1.8vw, 1.18rem);
    font-weight: 700;
    line-height: 1.45;
    margin: 0 0 16px;
  }
  .q-title .qnum {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    padding: 2px 9px;
    margin-right: 8px;
    font-size: .88em;
  }

  .options { display: grid; gap: 10px; }
  .option {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    user-select: none;
    line-height: 1.4;
    font-size: .97rem;
  }
  .option:hover:not(.disabled) { border-color: #93c5fd; background: #f8fbff; }
  .option input { margin-top: 2px; accent-color: var(--primary); flex: 0 0 auto; }
  .option.selected { border-color: var(--primary); background: #eff6ff; }
  .option.disabled { cursor: default; opacity: .95; }

  .option.correct {
    border-color: var(--green);
    background: var(--green-bg);
  }
  .option.incorrect {
    border-color: var(--red);
    background: var(--red-bg);
  }
  .option.correct .mark, .option.incorrect .mark {
    margin-left: auto;
    font-weight: 800;
    flex: 0 0 auto;
  }
  .option.correct .mark { color: var(--green); }
  .option.incorrect .mark { color: var(--red); }

  /* Matching */
  .match-grid { display: grid; gap: 12px; }
  .match-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 210px;
    gap: 12px;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    background: #fff;
  }
  .match-row.correct { border-color: var(--green); background: var(--green-bg); }
  .match-row.incorrect { border-color: var(--red); background: var(--red-bg); }
  .match-label { font-size: .95rem; line-height: 1.4; }
  .match-label b { color: var(--primary-dark); }
  select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: .92rem;
    color: var(--text);
    outline: none;
  }
  select:focus { border-color: var(--primary); }
  select:disabled { opacity: .95; }
  .match-feedback {
    grid-column: 1 / -1;
    font-size: .85rem;
    color: var(--red);
    font-weight: 600;
    margin-top: 2px;
  }
  .match-feedback.ok { color: var(--green); }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s, background .15s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: #eef2ff; color: #3730a3; }
  .btn-ghost:hover { background: #e0e7ff; }

  .feedback {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: .93rem;
    line-height: 1.45;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--green-bg); color: #14532d; border: 1px solid #86efac; }
  .feedback.bad { background: var(--red-bg); color: #7f1d1d; border: 1px solid #fca5a5; }
  .feedback.info { background: var(--amber-bg); color: #78350f; border: 1px solid #fcd34d; }
  .feedback b { font-weight: 800; }

  .result-hero {
    text-align: center;
    padding: 10px 0 6px;
  }
  .score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin: 8px auto 16px;
    background: conic-gradient(var(--green) var(--p, 0%), #e5e7eb 0);
    position: relative;
  }
  .score-circle::before {
    content: "";
    position: absolute;
    inset: 12px;
    background: #fff;
    border-radius: 50%;
  }
  .score-circle span {
    position: relative;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
  }
  .result-hero h2 { margin: 0 0 6px; font-size: 1.35rem; }
  .result-hero p { margin: 0; color: var(--muted); }

  .breakdown {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .stat {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat .n { font-size: 1.4rem; font-weight: 800; }
  .stat .l { font-size: .8rem; color: var(--muted); }
  .stat.good .n { color: var(--green); }
  .stat.bad .n { color: var(--red); }

  .review-list { margin-top: 20px; display: grid; gap: 8px; }
  .review-item {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    font-size: .9rem;
  }
  .review-item .idx { font-weight: 800; color: var(--muted); }
  .review-item .status { font-weight: 800; font-size: .8rem; padding: 3px 8px; border-radius: 999px; }
  .review-item.ok .status { background: var(--green-bg); color: var(--green); }
  .review-item.no .status { background: var(--red-bg); color: var(--red); }

  @media (max-width: 560px) {
    .match-row { grid-template-columns: 1fr; }
    .option { font-size: .93rem; }
  }
</style>

/* ============================================================
   UTILITIES
   ============================================================ */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function labelForIndex(i) {
  return String.fromCharCode(1040 + i); // А, Б, В, ...
}

/* ============================================================
   STATE
   ============================================================ */

let session = null;

function buildSession() {
  // Shuffle question order
  const qOrder = shuffle(RAW_QUESTIONS.map(q => q.id));

  // Prepare per-question shuffled data
  const byId = {};
  RAW_QUESTIONS.forEach(q => { byId[q.id] = q; });

  const prepared = qOrder.map(id => {
    const src = byId[id];
    if (src.type === "single") {
      // Shuffle options, keep track of correct original index
      const indexed = src.options.map((text, i) => ({ text, original: i }));
      const shuffled = shuffle(indexed);
      const correctOriginal = new Set(src.correct);
      return {
        id: src.id,
        type: src.type,
        q: src.q,
        options: shuffled.map(x => x.text),
        correct: shuffled.map((x, i) => correctOriginal.has(x.original) ? i : -1).filter(i => i >= 0)
      };
    }
    if (src.type === "multi") {
      const indexed = src.options.map((text, i) => ({ text, original: i }));
      const shuffled = shuffle(indexed);
      const correctOriginal = new Set(src.correct);
      return {
        id: src.id,
        type: src.type,
        q: src.q,
        options: shuffled.map(x => x.text),
        correct: shuffled.map((x, i) => correctOriginal.has(x.original) ? i : -1).filter(i => i >= 0)
      };
    }
    // match: shuffle right-side list only (left order fixed)
    return {
      id: src.id,
      type: src.type,
      q: src.q,
      left: src.left.map(x => ({ ...x })),
      right: shuffle(src.right.map(x => ({ ...x }))),
      correctMap: { ...src.correctMap }
    };
  });

  return {
    questions: prepared,
    current: 0,
    answers: new Array(prepared.length).fill(null), // store answer state per question
    results: new Array(prepared.length).fill(null), // 'ok' | 'no'
    finished: false
  };
}

/* ============================================================
   RENDER
   ============================================================ */

const card = document.getElementById("card");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const typeBadge = document.getElementById("typeBadge");

function updateProgress() {
  const total = session.questions.length;
  const idx = session.finished ? total : session.current;
  const pct = Math.round((idx / total) * 100);
  progressBar.style.width = pct + "%";
  if (session.finished) {
    progressText.textContent = `Тест завершён • ${total} вопросов`;
  } else {
    progressText.textContent = `Вопрос ${session.current + 1} из ${total}`;
  }
}

function typeLabel(type) {
  if (type === "single") return "Один ответ";
  if (type === "multi") return "Несколько ответов";
  return "Соответствие";
}

function renderQuestion() {
  updateProgress();
  const q = session.questions[session.current];
  const state = session.answers[session.current];
  const answered = state !== null && state.answered === true;

  typeBadge.textContent = typeLabel(q.type);

  if (q.type === "single") {
    renderSingle(q, state, answered);
  } else if (q.type === "multi") {
    renderMulti(q, state, answered);
  } else {
    renderMatch(q, state, answered);
  }
}

/* ---------- SINGLE ---------- */

function renderSingle(q, state, answered) {
  const selected = state ? state.selected : null;

  const optionsHtml = q.options.map((opt, i) => {
    let cls = "option";
    if (answered) {
      cls += " disabled";
      if (q.correct.includes(i)) cls += " correct";
      else if (selected === i) cls += " incorrect";
    } else if (selected === i) {
      cls += " selected";
    }
    const mark = answered
      ? (q.correct.includes(i) ? '<span class="mark">✓</span>'
        : (selected === i ? '<span class="mark">✗</span>' : ''))
      : '';
    return `<label class="${cls}" data-index="${i}">
      <input type="radio" name="single" value="${i}" ${selected === i ? "checked" : ""} ${answered ? "disabled" : ""}>
      <span>${labelForIndex(i)}) ${escapeHtml(opt)}</span>
      ${mark}
    </label>`;
  }).join("");

  const feedback = answered ? buildSingleFeedback(q, selected) : "";

  card.innerHTML = `
    <h2 class="q-title"><span class="qnum">${session.current + 1}</span>${escapeHtml(q.q)}</h2>
    <div class="options" id="options">${optionsHtml}</div>
    ${feedback}
    <div class="actions">
      ${answered
        ? `<button class="btn-primary" id="nextBtn">${session.current === session.questions.length - 1 ? "Показать результат" : "Следующий вопрос"}</button>`
        : `<button class="btn-primary" id="checkBtn" disabled>Проверить</button>`}
    </div>
  `;

  // interactions
  if (!answered) {
    const checkBtn = document.getElementById("checkBtn");
    card.querySelectorAll('input[name="single"]').forEach(inp => {
      inp.addEventListener("change", () => {
        card.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
        inp.closest(".option").classList.add("selected");
        checkBtn.disabled = false;
      });
    });
    checkBtn.addEventListener("click", () => {
      const chosen = card.querySelector('input[name="single"]:checked');
      if (!chosen) return;
      const idx = Number(chosen.value);
      const ok = q.correct.includes(idx);
      session.answers[session.current] = { answered: true, selected: idx };
      session.results[session.current] = ok ? "ok" : "no";
      renderQuestion();
      scrollCardIntoView();
    });
  } else {
    document.getElementById("nextBtn").addEventListener("click", goNext);
  }
}

function buildSingleFeedback(q, selected) {
  const ok = q.correct.includes(selected);
  if (ok) {
    return `<div class="feedback show good"><b>Верно!</b> Правильный ответ: ${q.correct.map(i => labelForIndex(i)).join(", ")}.</div>`;
  }
  return `<div class="feedback show bad"><b>Неверно.</b> Вы выбрали: ${labelForIndex(selected)}. Правильный ответ: ${q.correct.map(i => labelForIndex(i)).join(", ")} — ${escapeHtml(q.options[q.correct[0]])}.</div>`;
}

/* ---------- MULTI ---------- */

function renderMulti(q, state, answered) {
  const selected = state ? new Set(state.selected) : new Set();

  const optionsHtml = q.options.map((opt, i) => {
    let cls = "option";
    if (answered) {
      cls += " disabled";
      if (q.correct.includes(i)) cls += " correct";
      else if (selected.has(i)) cls += " incorrect";
    } else if (selected.has(i)) {
      cls += " selected";
    }
    const mark = answered
      ? (q.correct.includes(i) ? '<span class="mark">✓</span>'
        : (selected.has(i) ? '<span class="mark">✗</span>' : ''))
      : '';
    return `<label class="${cls}" data-index="${i}">
      <input type="checkbox" name="multi" value="${i}" ${selected.has(i) ? "checked" : ""} ${answered ? "disabled" : ""}>
      <span>${labelForIndex(i)}) ${escapeHtml(opt)}</span>
      ${mark}
    </label>`;
  }).join("");

  const feedback = answered ? buildMultiFeedback(q, selected) : "";

  card.innerHTML = `
    <h2 class="q-title"><span class="qnum">${session.current + 1}</span>${escapeHtml(q.q)}</h2>
    <div class="options" id="options">${optionsHtml}</div>
    ${feedback}
    <div class="actions">
      ${answered
        ? `<button class="btn-primary" id="nextBtn">${session.current === session.questions.length - 1 ? "Показать результат" : "Следующий вопрос"}</button>`
        : `<button class="btn-primary" id="checkBtn" disabled>Проверить</button>`}
    </div>
  `;

  if (!answered) {
    const checkBtn = document.getElementById("checkBtn");
    card.querySelectorAll('input[name="multi"]').forEach(inp => {
      inp.addEventListener("change", () => {
        inp.closest(".option").classList.toggle("selected", inp.checked);
        checkBtn.disabled = !card.querySelector('input[name="multi"]:checked');
      });
    });
    checkBtn.addEventListener("click", () => {
      const chosen = [...card.querySelectorAll('input[name="multi"]:checked')].map(x => Number(x.value));
      if (!chosen.length) return;
      const chosenSet = new Set(chosen);
      const correctSet = new Set(q.correct);
      const ok = chosenSet.size === correctSet.size && [...chosenSet].every(x => correctSet.has(x));
      session.answers[session.current] = { answered: true, selected: chosen };
      session.results[session.current] = ok ? "ok" : "no";
      renderQuestion();
      scrollCardIntoView();
    });
  } else {
    document.getElementById("nextBtn").addEventListener("click", goNext);
  }
}

function buildMultiFeedback(q, selectedSet) {
  const chosen = [...selectedSet].sort((a, b) => a - b);
  const correct = q.correct.slice().sort((a, b) => a - b);
  const ok = chosen.length === correct.length && chosen.every((x, i) => x === correct[i]);
  const correctStr = correct.map(i => `${labelForIndex(i)}) ${escapeHtml(q.options[i])}`).join("; ");
  if (ok) {
    return `<div class="feedback show good"><b>Верно!</b> Правильные ответы: ${correct.map(i => labelForIndex(i)).join(", ")}.</div>`;
  }
  return `<div class="feedback show bad"><b>Неверно.</b> Правильные ответы: ${correct.map(i => labelForIndex(i)).join(", ")}.<br><span style="font-weight:600">${correctStr}</span></div>`;
}

/* ---------- MATCH ---------- */

function renderMatch(q, state, answered) {
  const selectedMap = state ? state.selected : {};

  const rowsHtml = q.left.map(leftItem => {
    const chosen = selectedMap[leftItem.key] || "";
    let rowCls = "match-row";
    let feedback = "";
    if (answered) {
      const correctKey = q.correctMap[leftItem.key];
      const ok = chosen === correctKey;
      rowCls += ok ? " correct" : " incorrect";
      const correctText = q.right.find(r => r.key === correctKey)?.text || "";
      feedback = ok
        ? `<div class="match-feedback ok">✓ Верно: ${correctKey}</div>`
        : `<div class="match-feedback">✗ Выбрано: ${chosen || "—"}; правильно: ${correctKey}) ${escapeHtml(correctText)}</div>`;
    }
    const optionsHtml = q.right.map(r =>
      `<option value="${r.key}" ${chosen === r.key ? "selected" : ""}>${r.key}) ${escapeHtml(r.text)}</option>`
    ).join("");
    return `
      <div class="${rowCls}" data-left="${leftItem.key}">
        <div class="match-label"><b>${leftItem.key}.</b> ${escapeHtml(leftItem.text)}</div>
        <select ${answered ? "disabled" : ""} data-left="${leftItem.key}">
          <option value="">— выберите —</option>
          ${optionsHtml}
        </select>
        ${feedback}
      </div>
    `;
  }).join("");

  let feedback = "";
  if (answered) {
    const allOk = q.left.every(l => selectedMap[l.key] === q.correctMap[l.key]);
    feedback = allOk
      ? `<div class="feedback show good"><b>Верно!</b> Все соответствия установлены правильно.</div>`
      : `<div class="feedback show bad"><b>Есть ошибки.</b> Правильные соответствия показаны выше.</div>`;
  }

  card.innerHTML = `
    <h2 class="q-title"><span class="qnum">${session.current + 1}</span>${escapeHtml(q.q)}</h2>
    <div class="match-grid">${rowsHtml}</div>
    ${feedback}
    <div class="actions">
      ${answered
        ? `<button class="btn-primary" id="nextBtn">${session.current === session.questions.length - 1 ? "Показать результат" : "Следующий вопрос"}</button>`
        : `<button class="btn-primary" id="checkBtn">Проверить</button>`}
    </div>
  `;

  if (!answered) {
    const checkBtn = document.getElementById("checkBtn");
    const selects = [...card.querySelectorAll("select[data-left]")];
    const refresh = () => {
      checkBtn.disabled = selects.some(s => !s.value);
    };
    selects.forEach(s => {
      s.addEventListener("change", refresh);
    });
    refresh();

    checkBtn.addEventListener("click", () => {
      const map = {};
      selects.forEach(s => { map[s.dataset.left] = s.value; });
      const allFilled = q.left.every(l => map[l.key]);
      if (!allFilled) return;
      const ok = q.left.every(l => map[l.key] === q.correctMap[l.key]);
      session.answers[session.current] = { answered: true, selected: map };
      session.results[session.current] = ok ? "ok" : "no";
      renderQuestion();
      scrollCardIntoView();
    });
  } else {
    document.getElementById("nextBtn").addEventListener("click", goNext);
  }
}

/* ============================================================
   NAVIGATION
   ============================================================ */

function goNext() {
  if (session.current === session.questions.length - 1) {
    session.finished = true;
    renderResult();
    scrollCardIntoView();
    return;
  }
  session.current += 1;
  renderQuestion();
  scrollCardIntoView();
}

function scrollCardIntoView() {
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ============================================================
   RESULT
   ============================================================ */

function renderResult() {
  updateProgress();
  typeBadge.textContent = "Результат";

  const total = session.questions.length;
  const correctCount = session.results.filter(r => r === "ok").length;
  const pct = Math.round((correctCount / total) * 100);

  const byType = { single: { ok: 0, total: 0 }, multi: { ok: 0, total: 0 }, match: { ok: 0, total: 0 } };
  session.questions.forEach((q, i) => {
    byType[q.type].total += 1;
    if (session.results[i] === "ok") byType[q.type].ok += 1;
  });

  const reviewHtml = session.questions.map((q, i) => {
    const status = session.results[i];
    return `<div class="review-item ${status === "ok" ? "ok" : "no"}">
      <span class="idx">${i + 1}</span>
      <span>${escapeHtml(q.q)}</span>
      <span class="status">${status === "ok" ? "верно" : "ошибка"}</span>
    </div>`;
  }).join("");

  card.innerHTML = `
    <div class="result-hero">
      <div class="score-circle" style="--p:${pct}%"><span>${correctCount} / ${total}</span></div>
      <h2>${pct >= 90 ? "Отлично!" : pct >= 70 ? "Хороший результат" : pct >= 50 ? "Неплохо" : "Нужно повторить материал"}</h2>
      <p>Правильных ответов: <b>${correctCount}</b> из <b>${total}</b> (${pct}%)</p>
    </div>

    <div class="breakdown">
      <div class="stat good"><div class="n">${byType.single.ok}/${byType.single.total}</div><div class="l">Один ответ</div></div>
      <div class="stat good"><div class="n">${byType.multi.ok}/${byType.multi.total}</div><div class="l">Несколько ответов</div></div>
      <div class="stat good"><div class="n">${byType.match.ok}/${byType.match.total}</div><div class="l">Соответствие</div></div>
    </div>

    <div class="review-list">${reviewHtml}</div>

    <div class="actions">
      <button class="btn-primary" id="restartBtn">Пройти заново</button>
    </div>
  `;

  document.getElementById("restartBtn").addEventListener("click", () => {
    start();
  });
}

/* ============================================================
   HELPERS
   ============================================================ */

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ============================================================
   START
   ============================================================ */

function start() {
  session = buildSession();
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

start();
</script>
